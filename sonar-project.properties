# =====================================================================
# SonarCloud — análise via CI (GitHub Actions, job "sonarqube")
# ---------------------------------------------------------------------
# IMPORTANTE: a análise via CI não convive com a "Automatic Analysis".
# Desative-a em SonarCloud > Administration > Analysis Method antes de
# rodar o pipeline, senão o scanner falha com:
#   "You are running CI analysis while Automatic Analysis is enabled".
# =====================================================================

sonar.projectKey=nathalia-catolicasc_agendabeach
sonar.organization=nathalia-catolicasc
sonar.projectName=agendabeach
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------
# Escopo: o repositório inteiro (backend, frontend, Dockerfiles, CI),
# separando código de produção e código de teste.
# ---------------------------------------------------------------------
sonar.sources=.
sonar.tests=.

sonar.test.inclusions=\
  backend/src/test/**/*,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx

# - Artefatos de build e dependências.
# - Documentação (PDF/Markdown).
# - SQL: são scripts PostgreSQL, mas o SonarCloud só tem analisador de
#   Oracle PL/SQL, que gera falsos positivos (VARCHAR2 etc.). As migrations
#   são validadas pelos testes de integração com PostgreSQL real e não podem
#   ter o conteúdo alterado (checksum do Flyway).
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/target/**,\
  docs/**,\
  **/*.sql,\
  backend/src/test/**/*,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx

# ---------------------------------------------------------------------
# Backend (Java 21 / Spring Boot) — requer "mvn verify" antes do scan
# ---------------------------------------------------------------------
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.libraries=backend/target/dependency/*.jar
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ---------------------------------------------------------------------
# Frontend (React + TypeScript) — requer "npm run test:coverage"
# ---------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json,frontend/tsconfig.node.json

# ---------------------------------------------------------------------
# Cobertura: ignora código sem lógica testável (DTOs, entidades JPA,
# enums, interfaces Spring Data, bootstrap e barrels de re-export).
# ---------------------------------------------------------------------
sonar.coverage.exclusions=\
  backend/src/main/java/com/AgendaBeachApplication.java,\
  backend/src/main/java/**/dto/**,\
  backend/src/main/java/**/entity/**,\
  backend/src/main/java/**/enum/**,\
  backend/src/main/java/**/enums/**,\
  backend/src/main/java/**/repository/**,\
  frontend/src/main.tsx,\
  frontend/src/**/index.ts,\
  frontend/*.config.*,\
  **/Dockerfile,\
  docker-compose.yml,\
  .github/**
