# ============================================================
#  ESTEIRA AUTOMÁTICA (CI/CD) — projeto AgendaBeach
# ------------------------------------------------------------
#  Conferido em cima do repositório real:
#   - frontend/  -> React 19 + TypeScript + Vite
#   - backend/   -> Java 21 + Spring Boot (usa Maven wrapper ./mvnw)
#
#  Roda sozinha em push e Pull Request para main/develop.
# ============================================================

name: CI - Qualidade de Código

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:

  # ----------------------------------------------------------
  # CONFERENTE 1: FRONTEND (React + TypeScript)
  # ----------------------------------------------------------
  frontend:
    name: Revisar Frontend (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      # O projeto já tem o atalho "lint" no package.json ("eslint .")
      - name: Rodar o ESLint
        run: npm run lint

      # Confere formatação. (Só funciona depois que você instalar o Prettier —
      # veja o passo 1 do guia. Enquanto não instalar, comente esta etapa.)
      - name: Rodar o Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      # O projeto já tem o atalho "build" ("tsc -b && vite build")
      - name: Montar o projeto (build)
        run: npm run build

  # ----------------------------------------------------------
  # CONFERENTE 2: BACKEND (Java 21 + Spring Boot)
  # ----------------------------------------------------------
  backend:
    name: Revisar Backend (Java/Spring)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permissão ao Maven wrapper
        run: chmod +x ./mvnw

      - name: Compilar e rodar os testes
        run: ./mvnw -B clean verify

  # ----------------------------------------------------------
  # CONFERENTE 3: CHECK-UP GERAL (SonarCloud)
  # Compila o backend primeiro (o Sonar precisa das classes)
  # e depois analisa frontend + backend juntos.
  # ----------------------------------------------------------
  sonarqube:
    name: Check-up de Qualidade (SonarCloud)
    runs-on: ubuntu-latest
    needs: [ frontend, backend ]   # só roda se os dois passarem

    steps:
      - name: Baixar o código (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar o Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar o backend (gera as classes pro Sonar)
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw -B clean compile

      - name: Rodar a análise do SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          # Senha secreta guardada em Settings > Secrets > Actions (não cole aqui!)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}