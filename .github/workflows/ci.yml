name: CI - Docker Build & Testes

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ----------------------------------------------------------
  # 1. Compilação rápida do backend (sem Docker, feedback rápido)
  # ----------------------------------------------------------
  backend-compile:
    name: Backend · Compilação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar (falha rápido em erro de sintaxe/tipo)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean compile

  # ----------------------------------------------------------
  # 2. Testes unitários (Mockito, sem banco de dados)
  # ----------------------------------------------------------
  backend-unit-tests:
    name: Backend · Testes Unitários
    runs-on: ubuntu-latest
    needs: [backend-compile]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Rodar os testes unitários em container
        run: docker compose run --rm --build backend-unit-tests

  # ----------------------------------------------------------
  # 3. Teste de integração (sobe o contexto Spring + Postgres real)
  # ----------------------------------------------------------
  backend-integration-tests:
    name: Backend · Testes de Integração
    runs-on: ubuntu-latest
    needs: [backend-compile]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Subir o banco e rodar o teste de contexto
        run: |
          docker compose up -d db
          docker compose run --rm --build backend-integration-tests

      - name: Encerrar os containers
        if: always()
        run: docker compose down -v

  # ----------------------------------------------------------
  # 4. Build da imagem final do backend (só após os testes passarem)
  # ----------------------------------------------------------
  backend-image:
    name: Backend · Build da Imagem
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Build da imagem de produção
        run: docker build -t agendabeach-backend:ci ./backend

  # ----------------------------------------------------------
  # 5. Frontend: lint + prettier + build, tudo dentro da imagem
  # ----------------------------------------------------------
  frontend:
    name: Frontend · Build (lint/prettier/build)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Build da imagem (falha se lint/prettier/build falharem)
        run: docker build -t agendabeach-frontend:ci ./frontend

  # ----------------------------------------------------------
  # 6. Check-up de qualidade (SonarCloud)
  # ----------------------------------------------------------
  # Configuração da análise: sonar-project.properties (raiz do repositório).
  # Pré-requisitos no SonarCloud/GitHub:
  #   - "Automatic Analysis" DESATIVADA no projeto (conflita com a análise via CI);
  #   - secret SONAR_TOKEN cadastrado no repositório.
  sonarqube:
    name: Qualidade · SonarCloud
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend]
    # PRs vindos de forks não recebem o SONAR_TOKEN; evita falha falsa.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      # Postgres real para o teste de integração entrar na cobertura
      db:
        image: postgres:16
        env:
          POSTGRES_DB: agendabeach
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agendabeach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Baixar o código (histórico completo, usado no blame/new code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar o Java (JDK 21)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Instalar o Node.js (20)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend · testes + cobertura (JaCoCo) + bibliotecas pro Sonar
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agendabeach
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify dependency:copy-dependencies

      - name: Frontend · testes + cobertura (lcov)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: Rodar a análise do SonarCloud
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
