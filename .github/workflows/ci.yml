name: CI - Docker Build & Testes

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ----------------------------------------------------------
  # 1. Compilação rápida do backend (sem Docker, feedback rápido)
  # ----------------------------------------------------------
  backend-compile:
    name: Backend · Compilação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar (falha rápido em erro de sintaxe/tipo)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean compile

  # ----------------------------------------------------------
  # 2. Testes unitários (Mockito, sem banco de dados)
  # ----------------------------------------------------------
  backend-unit-tests:
    name: Backend · Testes Unitários
    runs-on: ubuntu-latest
    needs: [backend-compile]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Rodar os testes unitários em container
        run: docker compose run --rm --build backend-unit-tests

  # ----------------------------------------------------------
  # 3. Teste de integração (sobe o contexto Spring + Postgres real)
  # ----------------------------------------------------------
  backend-integration-tests:
    name: Backend · Testes de Integração
    runs-on: ubuntu-latest
    needs: [backend-compile]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Subir o banco e rodar o teste de contexto
        run: |
          docker compose up -d db
          docker compose run --rm --build backend-integration-tests

      - name: Encerrar os containers
        if: always()
        run: docker compose down -v

  # ----------------------------------------------------------
  # 4. Build da imagem final do backend (só após os testes passarem)
  # ----------------------------------------------------------
  backend-image:
    name: Backend · Build da Imagem
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Build da imagem de produção
        run: docker build -t agendabeach-backend:ci ./backend

  # ----------------------------------------------------------
  # 5. Frontend: lint + prettier + build, tudo dentro da imagem
  # ----------------------------------------------------------
  frontend:
    name: Frontend · Build (lint/prettier/build)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Build da imagem (falha se lint/prettier/build falharem)
        run: docker build -t agendabeach-frontend:ci ./frontend

  # ----------------------------------------------------------
  # 6. Check-up de qualidade (SonarCloud)
  # ----------------------------------------------------------
  sonarqube:
    name: Qualidade · SonarCloud
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend]
    steps:
      - name: Baixar o código (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar o Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compilar o backend (gera as classes pro Sonar)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean compile

      - name: Rodar a análise do SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
